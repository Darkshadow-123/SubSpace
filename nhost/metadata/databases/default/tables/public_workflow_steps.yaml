table: {schema: public, name: workflow_steps}
object_relationships: [{name: workflow, using: {foreign_key_constraint_on: workflow_id}}, {name: organization, using: {foreign_key_constraint_on: org_id}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}
  - role: editor
    permission: {columns: '*', filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}}
  - role: viewer
    permission: {columns: '*', filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: viewer}}]}}}}}
insert_permissions:
  - role: owner
    permission: {columns: '*', check: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}
  - role: editor
    permission: {columns: '*', check: {_and: [{type: {_nin: [db_write, notify]}}, {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}]}}
update_permissions:
  - role: owner
    permission: {columns: '*', filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}, check: null}
  - role: editor
    permission: {columns: '*', filter: {_and: [{type: {_nin: [db_write, notify]}}, {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}]}, check: {type: {_nin: [db_write, notify]}}}
delete_permissions:
  - role: owner
    permission: {filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}
  - role: editor
    permission: {filter: {_and: [{type: {_nin: [db_write, notify]}}, {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}]}}
