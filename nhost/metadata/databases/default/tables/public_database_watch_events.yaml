table: {schema: public, name: database_watch_events}
object_relationships: [{name: workflow, using: {foreign_key_constraint_on: workflow_id}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}
insert_permissions:
  - role: owner
    permission: {columns: [workflow_id, org_id, payload], check: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}
  - role: editor
    permission: {columns: [workflow_id, org_id, payload], check: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}}
event_triggers:
  - name: database_event_trigger
    definition:
      enable_manual: false
      insert:
        columns: "*"
    webhook: "{{NHOST_FUNCTIONS_URL}}/databaseEventHandler"
    headers:
      - name: x-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
      - name: content-type
        value: application/json
    retry_conf:
      num_retries: 2
      interval_sec: 10
      timeout_sec: 60
      tolerance_sec: 21600