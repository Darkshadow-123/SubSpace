table: {schema: public, name: notification_events}
object_relationships: [{name: workflow_run, using: {foreign_key_constraint_on: workflow_run_id}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {_exists: {_table: {schema: public, name: org_members}, _where: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}, {org_id: {_eq: notification_events.org_id}}]}}}}
event_triggers:
  - name: notification_events_trigger
    definition:
      enable_manual: true
      insert:
        columns: "*"
    webhook: "{{NHOST_FUNCTIONS_URL}}/notificationHandler"
    headers:
      - name: x-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
      - name: content-type
        value: application/json
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 60
      tolerance_sec: 21600