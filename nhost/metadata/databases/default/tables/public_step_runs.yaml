table: {schema: public, name: step_runs}
object_relationships: [{name: workflow_run, using: {foreign_key_constraint_on: workflow_run_id}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {workflow_run: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}}
  - role: editor
    permission: {columns: '*', filter: {workflow_run: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}}}
  - role: viewer
    permission: {columns: '*', filter: {workflow_run: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: viewer}}]}}}}}}
update_permissions:
  - role: owner
    permission: {columns: [status, approved_by, approved_at], filter: {workflow_run: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}}, check: null}
  - role: editor
    permission: {columns: [status, approved_by, approved_at], filter: {workflow_run: {workflow: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}}, check: null}
