table: {schema: public, name: workflows}
object_relationships: [{name: organization, using: {foreign_key_constraint_on: org_id}}]
array_relationships: [{name: workflow_steps, using: {foreign_key_constraint_on: {table: workflow_steps, column: workflow_id}}}, {name: workflow_triggers, using: {foreign_key_constraint_on: {table: workflow_triggers, column: workflow_id}}}, {name: workflow_runs, using: {foreign_key_constraint_on: {table: workflow_runs, column: workflow_id}}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}
  - role: editor
    permission: {columns: '*', filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}}
  - role: viewer
    permission: {columns: '*', filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: viewer}}]}}}}
insert_permissions:
  - role: owner
    permission: {check: {_exists: {_table: {schema: public, name: org_members}, _where: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}, {org_id: {_eq: workflows.org_id}}]}}}, columns: '*'}
  - role: editor
    permission: {check: {_exists: {_table: {schema: public, name: org_members}, _where: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}, {org_id: {_eq: workflows.org_id}}]}}}, columns: '*'}
update_permissions:
  - role: owner
    permission: {columns: '*', filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}, check: null}
  - role: editor
    permission: {columns: [name, description, is_enabled, updated_at], filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}, check: null}
delete_permissions:
  - role: owner
    permission: {filter: {organization: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}}
