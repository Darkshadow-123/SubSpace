table: {schema: public, name: organizations}
object_relationships: [{name: usage, using: {manual_configuration: {remote_table: {schema: public, name: org_usage_this_month}, column_mapping: {id: org_id}}}}]
array_relationships: [{name: members, using: {foreign_key_constraint_on: {table: org_members, column: org_id}}}, {name: workflows, using: {foreign_key_constraint_on: {table: workflows, column: org_id}}}]
select_permissions:
  - role: owner
    permission: {columns: '*', filter: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: owner}}]}}}
  - role: editor
    permission: {columns: [id, name, calls_used, calls_allowed], filter: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: editor}}]}}}
  - role: viewer
    permission: {columns: [id, name, calls_used, calls_allowed], filter: {members: {_and: [{user_id: {_eq: X-Hasura-User-Id}}, {role: {_eq: viewer}}]}}}