actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{FUNCTIONS_URL}}/triggerWorkflowRun'
      headers: [{name: x-hasura-admin-secret, value_from_env: NHOST_ADMIN_SECRET}]
    permissions: [{role: owner}, {role: editor}]
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{FUNCTIONS_URL}}/approveStep'
      headers: [{name: x-hasura-admin-secret, value_from_env: NHOST_ADMIN_SECRET}]
    permissions: [{role: owner}, {role: editor}]
custom_types:
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: run_id
          type: uuid!
        - name: status
          type: String!
  scalars: []
  enums: []
